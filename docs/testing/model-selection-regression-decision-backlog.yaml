schemaVersion: 1
backlogId: model-selection-regression-decisions
title: 模型选择回归矩阵的隐含决策与契约核验清单
status: planning
language: zh-CN
purpose: >-
  将模型供应商、模型选择、思考深度、Registry、请求投影、Session、队列、远程恢复和
  下游模型消费者中不能安全假设的 edge case 单独列出，供产品裁决、文档收敛、实现核验和后续剪枝使用。
statusValues:
  undefined: "产品行为尚未足够明确，需要裁决"
  contract-conflict: "现有 spec、实现或既有 case 互相冲突，需要先收敛权威口径"
  resolved-needs-proof: "已有设计倾向或实现事实，但仍需要测试/日志/请求证据证明"
  pruned-by-contract: "已经由明确 invariant 剪掉；保留记录防止未来误加回"
decisionRule: >-
  undefined 和 contract-conflict 不得直接生成会断言产品行为的 formal E2E；resolved-needs-proof
  进入验证队列而不是再次向用户提问；pruned-by-contract 只能在引用 invariant 后剪枝。
summary:
  totalEntries: 114
  decisionEntries: 64
  contractConflictEntries: 12
  proofEntries: 38
  note: "decisionEntries 只表示需要产品/契约决策的 undefined 项，不代表只有这些项需要测试。"
evidenceConventions:
  - "newer-design: 较新的 Provider refactor interaction/selection design"
  - "state-space: conversation-product-state-space.md"
  - "protocol: conversation-product-protocol.md 或 conversation-protocol-declaration.md"
  - "runtime: 当前 live code 的 resolver、input-intent、ModelFactory 或 handler"
  - "case-catalog: conversation-session-case-catalog.md 中已有 case"
  - "graph: feature-boundary-planner graph；当前没有 live codegraph index 时不得伪造结果"
entries:
  - id: DEC-001
    domain: selection
    status: undefined
    question: "空白新对话首次打开 picker 时，Recent 无效且 Host preferred 也无效，应显示什么？"
    options:
      [
        "空状态并阻止发送",
        "选择器显示不可用原因但允许用户进入 Provider 设置",
        "自动选择任意可用模型",
      ]
    recommendation: "优先空状态加明确修复入口；禁止静默选择任意模型。"
    evidence:
      [
        "runtime: modelSelectionRecent 只接受 selectable Recent，否则回到 Host preferred",
        "blocking: 首次发送无法形成 complete selection",
      ]
    blockingCases: [MSR-DRAFT-001]

  - id: DEC-002
    domain: selection
    status: undefined
    question: "Recent 记录了 provider/model，但模型后来被 disabled 时，draft 是保留意图、换 preferred，还是清空？"
    options: ["保留 intent 并显示 unavailable", "切到 Host preferred", "清空并要求重新选择"]
    recommendation: "默认保留 intent，直到用户明确改选；是否允许发送需另由 capability guard 决定。"
    evidence:
      [
        "newer-design: selection-state 要求已有 Session 不因不可用而静默 fallback",
        "runtime: Recent 只有 selectable 才作为可选初始化值",
      ]
    blockingCases: [MSR-DRAFT-003, MSR-SESSION-007]

  - id: DEC-003
    domain: selection
    status: undefined
    question: "Recent、Host preferred、provider family default 三者同时存在时，优先级是否固定为 Recent > Host preferred > family default？"
    options: ["固定该优先级", "按 surface 使用不同优先级", "只允许显式 Host preferred"]
    recommendation: "保持统一优先级；surface 如有例外必须显式声明。"
    evidence:
      [
        "runtime: modelSelectionRecent 的 workspace-keyed fallback chain",
        "docs: new-task/manual-switch resolution chain",
      ]
    blockingCases: [MSR-DRAFT-001, MSR-SURFACE-007]

  - id: DEC-004
    domain: selection
    status: undefined
    question: "用户只切换 provider、没有重新选 model 时，是否保留原 modelId 作为跨 provider 意图？"
    options:
      ["provider 改变即清空 modelId 并重新解析", "按同名模型迁移", "保留原 modelId 直到校验失败"]
    recommendation: "不要按字符串同名自动迁移；provider 改变后重新解析 model。"
    evidence:
      [
        "runtime: ModelSelection 的 providerId/modelId 是完整身份",
        "risk: 两个 Provider 可有同名模型",
      ]
    blockingCases: [MSR-SELECT-002, MSR-REG-002]

  - id: DEC-005
    domain: selection
    status: resolved-needs-proof
    question: "模型选择展示值能否直接用 provider/model$variant 作为跨进程和持久化值？"
    options:
      [
        "只能展示编码，协议使用结构化 ModelSelection",
        "允许字符串作为兼容格式",
        "所有地方统一使用展示字符串",
      ]
    recommendation: "采用第一项；需要补充 slash、colon、dollar 和空值的 round-trip 证据。"
    evidence:
      [
        "runtime: packages/shared/src/model-selection.ts",
        "newer-design: sparse intent 与 canonical submission 分离",
      ]
    blockingCases: [MSR-REG-002, MSR-REG-003]

  - id: DEC-006
    domain: selection
    status: undefined
    question: "同一次操作同时改变 provider、model、thought 时，校验失败应整体回滚还是保留部分 draft？"
    options:
      ["原子回滚到 authoritative draft", "保留可接受字段并清掉失败字段", "保留用户输入并标红"]
    recommendation: "commit 采用原子语义；renderer draft 是否保留未提交意图需单独定义。"
    evidence:
      [
        "newer-design: authoritative draft model config 与 CAS",
        "runtime: composer draft 具有 renderer-local reactive intent",
      ]
    blockingCases: [MSR-DRAFT-004, MSR-SESSION-002]

  - id: DEC-007
    domain: selection
    status: undefined
    question: "模型 capability 在 picker 打开后发生变化，发送时应以打开时快照还是提交时 Registry 为准？"
    options: ["提交时重新校验 Registry", "沿用 picker 打开时快照", "两者不一致时阻止并要求刷新"]
    recommendation: "提交时重新校验；若已选值失效，保留 intent 并给出可解释错误。"
    evidence:
      ["runtime: target Host Registry 是 authority", "risk: remote Registry loading/revision 变化"]
    blockingCases: [MSR-DRAFT-005, MSR-REG-006]

  - id: DEC-008
    domain: selection
    status: undefined
    question: "同一 modelId 的 selectable、disabled、deprecated 版本同时出现时，picker 分组和默认解析如何判定？"
    options:
