    recommendation: "候选与历史展示分离；禁止隐式 revision migration。"
    evidence:
      ["registry: model membership and enablement design", "blocking: disabled-current UI 仍有冲突"]
    blockingCases: [MSR-REG-005, MSR-UI-003]

  - id: DEC-009
    domain: selection
    status: undefined
    question: "model 的 default thought/variant 变化时，已有 sparse selection 的空 option 是否跟随新 default？"
    options:
      [
        "空 option 每次 ModelFactory 创建时解析最新 default",
        "首次解析后冻结到 Session",
        "更新 Registry 即回写 Session selection",
